name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: tag matches framework.Version
        run: test "$(go run . version)" = "ape $GITHUB_REF_NAME"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Asset names are what `uname -s` and `uname -m` print, so one curl line installs on every target.
      - name: build
        run: |
          for t in linux/amd64/Linux-x86_64 linux/arm64/Linux-aarch64 darwin/amd64/Darwin-x86_64 darwin/arm64/Darwin-arm64; do
            IFS=/ read -r os arch name <<<"$t"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/ape-$name" .
          done
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
